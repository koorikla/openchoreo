# Data plane "dp-prod": its own k3d cluster, serves production.
# Reaches the control plane's cluster-gateway through the cp gateway on 8443;
# the hostname resolves to host.k3d.internal via the CoreDNS rewrite.

openchoreo-data-plane:
  clusterAgent:
    serverUrl: "wss://cluster-gateway.openchoreo.localhost:8443/ws"
    planeID: dp-prod
    tls:
      # Issue this agent's client certificate from the control plane's own
      # cluster-gateway CA instead of from a CA this plane mints for itself.
      # caSecretName is left at its chart default, cluster-gateway-ca.
      #
      # What it buys: the control plane trusts its own CA by definition, so
      # nothing has to be handed back after install. Every plane CR can point
      # clientCA.secretKeyRef at cluster-gateway-ca as static git YAML, and
      # bootstrap/link-planes.sh collapses from a two-way exchange into a
      # one-way push.
      #
      # What it costs: a cert-manager CA Issuer signs locally, so it needs the
      # CA's PRIVATE KEY - the control plane's cluster-gateway-ca key must be
      # present in this namespace. Any plane holding that key can mint a cert
      # the control plane trusts, i.e. impersonate another plane (and, since
      # the same CA signs the gateway's server cert, impersonate the gateway).
      # Upstream defaults generateCerts to true precisely to keep per-plane CA
      # isolation. This is a demo-appropriate simplification, not a general
      # improvement.
      generateCerts: false

  gateway:
    httpPort: 29080
    httpsPort: 29443
    tls:
      enabled: false
