# Observability plane on the cp cluster. Receives telemetry from the local
# dp-nonprod plane over cluster-local addresses, and from the remote dp-prod
# cluster via host.k3d.internal on 11080/11084/11085/11086.

openchoreo-observability-plane:
  finOpsAgent:
    http:
      hostnames:
      - finops-agent.openchoreo.localhost

  observer:
    secretName: observer-secret
    controlPlaneApiUrl: "http://api.openchoreo.localhost:8080"
    cors:
      allowedOrigins:
      - "http://openchoreo.localhost:8080"
    extraEnvs:
    - name: OBSERVER_BASE_URL
      value: "http://observer.openchoreo.localhost:11080"
    - name: AUTHZ_TIMEOUT
      value: "30s"
    http:
      hostnames:
      - observer.openchoreo.localhost
      - host.k3d.internal

  security:
    oidc:
      jwksUrl: "http://thunder-service.thunder.svc.cluster.local:8090/oauth2/jwks"
      tokenUrl: "http://thunder-service.thunder.svc.cluster.local:8090/oauth2/token"
      authServerBaseUrl: "http://thunder.openchoreo.localhost:8080"
      jwksUrlTlsInsecureSkipVerify: "true"

  rca:
    openchoreoApiUrl: "http://api.openchoreo.localhost:8080"
    cors:
      allowedOrigins:
      - "http://openchoreo.localhost:8080"
    http:
      hostnames:
      - rca-agent.openchoreo.localhost
      - host.k3d.internal

  gateway:
    httpPort: 11080
    httpsPort: 11085
    tls:
      enabled: false
    tlsPassthrough:
      enabled: true
      hostname: "opensearch.observability.openchoreo.localhost"
      port: 11085

  tls:
    enabled: true
    dnsNames:
      - "observability.openchoreo.localhost"
      - "*.observability.openchoreo.localhost"

  clusterAgent:
    serverUrl: "wss://cluster-gateway.openchoreo-control-plane.svc.cluster.local:8443/ws"
    planeID: default
    tls:
      # Issue this agent's client certificate from the control plane's own
      # cluster-gateway CA instead of from a CA this plane mints for itself.
      # caSecretName is left at its chart default, cluster-gateway-ca.
      #
      # What it buys: the control plane trusts its own CA by definition, so
      # nothing has to be handed back after install. Every plane CR can point
      # clientCA.secretKeyRef at cluster-gateway-ca as static git YAML, and
      # bootstrap/link-planes.sh collapses from a two-way exchange into a
      # one-way push.
      #
      # What it costs: a cert-manager CA Issuer signs locally, so it needs the
      # CA's PRIVATE KEY - the control plane's cluster-gateway-ca key must be
      # present in this namespace. Any plane holding that key can mint a cert
      # the control plane trusts, i.e. impersonate another plane (and, since
      # the same CA signs the gateway's server cert, impersonate the gateway).
      # Upstream defaults generateCerts to true precisely to keep per-plane CA
      # isolation. This is a demo-appropriate simplification, not a general
      # improvement.
      generateCerts: false
