apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cp-observability-plane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: openchoreo
  sources:
    - repoURL: https://github.com/koorikla/openchoreo.git
      targetRevision: feat/multicluster-argocd
      ref: values
    - repoURL: ghcr.io/openchoreo/helm-charts
      chart: openchoreo-observability-plane
      targetRevision: 1.2.3
      helm:
        valueFiles:
          - $values/values/cp/observability-plane.yaml
  destination:
    name: in-cluster
    namespace: openchoreo-observability-plane
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
