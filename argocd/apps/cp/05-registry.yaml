apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cp-registry
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: openchoreo
  sources:
    - repoURL: https://github.com/koorikla/openchoreo.git
      targetRevision: feat/multicluster-argocd
      ref: values
    - repoURL: https://twuni.github.io/docker-registry.helm
      chart: docker-registry
      targetRevision: 3.0.0
      helm:
        valueFiles:
          - $values/values/cp/registry.yaml
  destination:
    name: in-cluster
    namespace: openchoreo-workflow-plane
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
