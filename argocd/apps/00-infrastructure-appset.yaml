# Cluster infrastructure: the addons (cert-manager, ESO, kgateway, OpenBao,
# Thunder, registry, OpenSearch operator), the OpenChoreo planes themselves and
# the observability modules, for both clusters, generated from one list.
#
# Most elements point at a local wrapper chart under argocd/charts/. The
# wrapper's Chart.yaml pins the upstream chart version and its values.yaml holds
# the overrides, so these Applications need only a SINGLE git source. Argo CD's
# repo-server runs `helm dependency build` against the committed Chart.lock to
# fetch the pinned upstream chart.
#
# The secrets and routes layers instead point at plain-manifest directories
# under argocd/manifests/ — the shared `path` field covers both, since the
# template feeds it straight to source.path and Argo CD auto-detects a Directory
# source when there is no `helm:` block.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # RollingSync gates addons -> secrets -> planes -> observability -> telemetry
  # -> routes. This ordering CANNOT be expressed with sync-waves across separate
  # ApplicationSets: an ApplicationSet has no health check, so the parent
  # app-of-apps treats it as Healthy immediately and the waves order only object
  # creation, not readiness. RollingSync also only orders steps within ONE
  # ApplicationSet, which is why all six layers live in the same file.
  #
  # Requires applicationsetcontroller.enable.progressive.syncs=true, set by
  # bootstrap/setup.sh. Without it the strategy block is silently ignored and
  # behaviour falls back to applying everything concurrently.
  strategy:
    type: RollingSync
    rollingSync:
      # The six layers form a strict dependency chain, and each arrow is a
      # readiness dependency that only RollingSync can express:
      #
      #   addons -> secrets -> planes -> observability -> telemetry -> routes
      #
      #   * secrets needs ESO's CRDs (ClusterSecretStore, ExternalSecret) and a
      #     running OpenBao to authenticate against — both come from addons.
      #   * planes needs the backstage-secrets and observer-secret Secrets to
      #     already be materialised: Backstage and the observer mount them by
      #     name and will not start otherwise. Those come from secrets.
      #   * observability needs the observability plane's gateway-default
      #     Gateway (the receivers attach HTTPRoutes and a TLSRoute to it) and
      #     the opensearch-admin-credentials Secret. Gateway from planes,
      #     Secret from secrets.
      #   * telemetry MUST NOT be merged into observability. The agents are log
      #     and event shippers; the receivers include an openSearchSetup Job
      #     that applies the `container-logs-*` index template, the ISM
      #     retention policy and the alerting webhook. If Fluent Bit writes the
      #     first document before that template lands, OpenSearch creates the
      #     index from dynamic mappings, the query adapter cannot read those
      #     fields, and the Observer silently returns no logs — the failure the
      #     pre-Argo CD bootstrap/setup.sh avoided by installing the logs module
      #     with `fluent-bit.enabled=false` and only re-running
      #     `helm upgrade --reuse-values --set fluent-bit.enabled=true` once the
      #     receivers were up. `--reuse-values` has no GitOps equivalent, so the
      #     two phases become two RollingSync steps and two charts:
      #     argocd/charts/observability/logs-opensearch (store + setup +
      #     adapter, Fluent Bit off) then argocd/charts/telemetry/logs-fluentbit
      #     (Fluent Bit only). The same ordering is what lets the exporters find
      #     the receivers' routes already published.
      #   * routes needs the gateway-default Gateway, which the control-plane
      #     chart creates in the planes layer. routes is therefore LAST: an
      #     HTTPRoute placed in an earlier step could never resolve its
      #     parentRef, so it would never report Healthy and RollingSync would
      #     deadlock on that step forever rather than moving on to create the
      #     Gateway it is waiting for.
      steps:
        - matchExpressions:
            - key: openchoreo.dev/layer
              operator: In
              values: [addons]
        - matchExpressions:
            - key: openchoreo.dev/layer
              operator: In
              values: [secrets]
        - matchExpressions:
            - key: openchoreo.dev/layer
              operator: In
              values: [planes]
        - matchExpressions:
            - key: openchoreo.dev/layer
              operator: In
              values: [observability]
        - matchExpressions:
            - key: openchoreo.dev/layer
              operator: In
              values: [telemetry]
        - matchExpressions:
            - key: openchoreo.dev/layer
              operator: In
              values: [routes]
  generators:
    - list:
        elements:
          # === addons layer ==================================================
          # --- cert-manager -------------------------------------------------
          - name: cp-cert-manager
            layer: addons
            cluster: in-cluster
            namespace: cert-manager
            path: argocd/charts/addons/cert-manager
          - name: dp-prod-cert-manager
            layer: addons
            cluster: dp-prod
            namespace: cert-manager
            path: argocd/charts/addons/cert-manager
          # --- external-secrets ---------------------------------------------
          - name: cp-external-secrets
            layer: addons
            cluster: in-cluster
            namespace: external-secrets
            path: argocd/charts/addons/external-secrets
          - name: dp-prod-external-secrets
            layer: addons
            cluster: dp-prod
            namespace: external-secrets
            path: argocd/charts/addons/external-secrets
          # --- kgateway CRDs -------------------------------------------------
          - name: cp-kgateway-crds
            layer: addons
            cluster: in-cluster
            namespace: openchoreo-control-plane
            path: argocd/charts/addons/kgateway-crds
          - name: dp-prod-kgateway-crds
            layer: addons
            cluster: dp-prod
            namespace: openchoreo-data-plane
            path: argocd/charts/addons/kgateway-crds
          # --- kgateway ------------------------------------------------------
          - name: cp-kgateway
            layer: addons
            cluster: in-cluster
            namespace: openchoreo-control-plane
            path: argocd/charts/addons/kgateway
          - name: dp-prod-kgateway
            layer: addons
            cluster: dp-prod
            namespace: openchoreo-data-plane
            path: argocd/charts/addons/kgateway
          # --- OpenBao -------------------------------------------------------
          - name: cp-openbao
            layer: addons
            cluster: in-cluster
            namespace: openbao
            path: argocd/charts/addons/openbao
          - name: dp-prod-openbao
            layer: addons
            cluster: dp-prod
            namespace: openbao
            path: argocd/charts/addons/openbao
          # --- control-plane-only addons -------------------------------------
          - name: cp-thunder
            layer: addons
            cluster: in-cluster
            namespace: thunder
            path: argocd/charts/addons/thunder
          # registry and the OpenSearch operator come from classic HTTPS chart
          # repos rather than OCI registries; that distinction now lives in the
          # wrapper Chart.yaml dependencies, not here.
          - name: cp-registry
            layer: addons
            cluster: in-cluster
            namespace: openchoreo-workflow-plane
            path: argocd/charts/addons/registry
          # === secrets layer =================================================
          # Plain-manifest directories, not wrapper charts — the `path` field is
          # shared with the chart elements above because the template only ever
          # feeds it to source.path, and with no `helm:` block Argo CD
          # auto-detects a Directory source for these.
          #
          # The ClusterSecretStore goes to both clusters; the platform
          # ExternalSecrets are control-plane-only because Backstage, the
          # observer and OpenSearch only run there.
          - name: cp-secret-store
            layer: secrets
            cluster: in-cluster
            namespace: openbao
            path: argocd/manifests/common
          - name: dp-prod-secret-store
            layer: secrets
            cluster: dp-prod
            namespace: openbao
            path: argocd/manifests/common
          - name: cp-platform-secrets
            layer: secrets
            cluster: in-cluster
            namespace: openchoreo-control-plane
            path: argocd/manifests/cp
          # dp-prod needs its own opensearch-admin-credentials: the Fluent Bit
          # and event-collector agents in the telemetry layer mount it there to
          # authenticate against the cp cluster's OpenSearch. dp-prod's own
          # OpenBao seeds the identical literals, so both clusters resolve to
          # the same credentials.
          - name: dp-prod-observability-secrets
            layer: secrets
            cluster: dp-prod
            namespace: openchoreo-observability-plane
            path: argocd/manifests/dp-prod
          # === planes layer ==================================================
          # All five wrap the same chart repo at the same version; the pin lives
          # in each wrapper chart's Chart.yaml under argocd/charts/planes/, so an
          # element only names its destination and the wrapper path.
          - name: cp-control-plane
            layer: planes
            cluster: in-cluster
            namespace: openchoreo-control-plane
            path: argocd/charts/planes/control-plane
          - name: cp-workflow-plane
            layer: planes
            cluster: in-cluster
            namespace: openchoreo-workflow-plane
            path: argocd/charts/planes/workflow-plane
          - name: cp-observability-plane
            layer: planes
            cluster: in-cluster
            namespace: openchoreo-observability-plane
            path: argocd/charts/planes/observability-plane
          - name: cp-data-plane-nonprod
            layer: planes
            cluster: in-cluster
            namespace: openchoreo-data-plane
            path: argocd/charts/planes/data-plane-nonprod
          - name: dp-prod-data-plane
            layer: planes
            cluster: dp-prod
            namespace: openchoreo-data-plane
            path: argocd/charts/planes/data-plane-prod
          # === observability layer ===========================================
          # The RECEIVER half of the four observability modules. cp only: the
          # observability plane lives there, and so does dp-nonprod, so the
          # receivers double as that plane's local collectors.
          #
          # logs-opensearch owns the single shared OpenSearch instance; the
          # tracing and metrics receivers point at it rather than standing up
          # their own. All three publish themselves on the observability
          # plane's gateway-default Gateway.
          - name: cp-logs-opensearch
            layer: observability
            cluster: in-cluster
            namespace: openchoreo-observability-plane
            path: argocd/charts/observability/logs-opensearch
          - name: cp-tracing-receiver
            layer: observability
            cluster: in-cluster
            namespace: openchoreo-observability-plane
            path: argocd/charts/observability/tracing-receiver
          - name: cp-metrics-receiver
            layer: observability
            cluster: in-cluster
            namespace: openchoreo-observability-plane
            path: argocd/charts/observability/metrics-receiver
          # === telemetry layer ===============================================
          # The AGENT half. Deliberately a separate layer from observability —
          # see the rollingSync comment above for the index-template race that
          # ordering prevents.
          #
          # logs-fluentbit and events-otel are the same wrapper chart deployed
          # to both clusters; both ship to host.k3d.internal:11085, the cp
          # cluster's published TLS-passthrough port. The tracing and metrics
          # exporters are dp-prod-only, because on cp the receivers already
          # collect locally.
          - name: cp-logs-fluentbit
            layer: telemetry
            cluster: in-cluster
            namespace: openchoreo-observability-plane
            path: argocd/charts/telemetry/logs-fluentbit
          - name: dp-prod-logs-fluentbit
            layer: telemetry
            cluster: dp-prod
            namespace: openchoreo-observability-plane
            path: argocd/charts/telemetry/logs-fluentbit
          - name: cp-events-otel
            layer: telemetry
            cluster: in-cluster
            namespace: openchoreo-observability-plane
            path: argocd/charts/telemetry/events-otel
          - name: dp-prod-events-otel
            layer: telemetry
            cluster: dp-prod
            namespace: openchoreo-observability-plane
            path: argocd/charts/telemetry/events-otel
          - name: dp-prod-tracing-exporter
            layer: telemetry
            cluster: dp-prod
            namespace: openchoreo-observability-plane
            path: argocd/charts/telemetry/tracing-exporter
          - name: dp-prod-metrics-exporter
            layer: telemetry
            cluster: dp-prod
            namespace: openchoreo-observability-plane
            path: argocd/charts/telemetry/metrics-exporter
          # === routes layer ==================================================
          # Gateway API routes that attach to Gateways created by the planes
          # layer, so they can only sync once that layer is Healthy.
          - name: cp-argocd-route
            layer: routes
            cluster: in-cluster
            namespace: argocd
            path: argocd/manifests/cp-routes
  template:
    metadata:
      name: '{{.name}}'
      labels:
        # RollingSync steps select on the labels of the GENERATED Applications,
        # so the layer must be stamped here, not only on the list element.
        openchoreo.dev/layer: '{{.layer}}'
      annotations:
        argocd.argoproj.io/sync-wave: "-20"
    spec:
      project: openchoreo
      source:
        repoURL: https://github.com/koorikla/openchoreo.git
        targetRevision: main
        path: '{{.path}}'
      destination:
        name: '{{.cluster}}'
        namespace: '{{.namespace}}'
      # Gateway API's API server defaults group/kind on parentRefs and
      # group/kind/weight on backendRefs. Argo CD's client-side diff reads those
      # additions as drift, so route-bearing apps sit OutOfSync forever while
      # being perfectly Healthy - and under RollingSync that is fatal, not
      # cosmetic. These must live in the ApplicationSet template: patching a
      # generated Application directly is silently reverted on the next
      # reconcile.
      ignoreDifferences:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jqPathExpressions:
            - .spec.parentRefs[].group
            - .spec.parentRefs[].kind
            - .spec.rules[].backendRefs[].group
            - .spec.rules[].backendRefs[].kind
            - .spec.rules[].backendRefs[].weight
        - group: gateway.networking.k8s.io
          kind: TLSRoute
          jqPathExpressions:
            - .spec.parentRefs[].group
            - .spec.parentRefs[].kind
            - .spec.rules[].backendRefs[].group
            - .spec.rules[].backendRefs[].kind
            - .spec.rules[].backendRefs[].weight
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        # One generous retry budget for all six layers. It is sized for the planes:
        # each data-plane agent CrashLoops until bootstrap/link-planes.sh
        # installs the `cluster-gateway-ca` configmap, so those Applications stay
        # unhealthy for a long window on a cold bootstrap and must keep retrying
        # rather than fail out. Applying the same budget to the addons is
        # harmless — they simply never exhaust it.
        retry:
          limit: 20
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
