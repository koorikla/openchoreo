# Cluster addons (cert-manager, ESO, kgateway, OpenBao, Thunder, registry,
# OpenSearch operator) for both clusters, generated from one list.
#
# Each element points at a local wrapper chart under argocd/charts/addons/.
# The wrapper's Chart.yaml pins the upstream chart version and its values.yaml
# holds the overrides, so these Applications need only a SINGLE git source.
# Argo CD's repo-server runs `helm dependency build` against the committed
# Chart.lock to fetch the pinned upstream chart.
#
# ORDERING CAVEAT: an ApplicationSet has no Argo CD health check of its own —
# it is Healthy the moment the CR exists. The sync-wave annotation below
# therefore orders only the creation of this ApplicationSet relative to the
# other manifests under argocd/apps/; it does NOT make wave -10 (the planes)
# wait for the Applications generated here to become Healthy. Addon-before-plane
# ordering is consequently retry-driven: the plane Applications retry until the
# CRDs and webhooks these addons install are present. If first-sync flakes show
# up in practice, the upgrade path is to set `spec.strategy.type: RollingSync`
# here (and on the planes set) with steps keyed off the per-Application
# sync-wave labels, which does gate on generated-Application health.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          # --- cert-manager -------------------------------------------------
          - name: cp-cert-manager
            cluster: in-cluster
            namespace: cert-manager
            chartPath: argocd/charts/addons/cert-manager
          - name: dp-prod-cert-manager
            cluster: dp-prod
            namespace: cert-manager
            chartPath: argocd/charts/addons/cert-manager
          # --- external-secrets ---------------------------------------------
          - name: cp-external-secrets
            cluster: in-cluster
            namespace: external-secrets
            chartPath: argocd/charts/addons/external-secrets
          - name: dp-prod-external-secrets
            cluster: dp-prod
            namespace: external-secrets
            chartPath: argocd/charts/addons/external-secrets
          # --- kgateway CRDs -------------------------------------------------
          - name: cp-kgateway-crds
            cluster: in-cluster
            namespace: openchoreo-control-plane
            chartPath: argocd/charts/addons/kgateway-crds
          - name: dp-prod-kgateway-crds
            cluster: dp-prod
            namespace: openchoreo-data-plane
            chartPath: argocd/charts/addons/kgateway-crds
          # --- kgateway ------------------------------------------------------
          - name: cp-kgateway
            cluster: in-cluster
            namespace: openchoreo-control-plane
            chartPath: argocd/charts/addons/kgateway
          - name: dp-prod-kgateway
            cluster: dp-prod
            namespace: openchoreo-data-plane
            chartPath: argocd/charts/addons/kgateway
          # --- OpenBao -------------------------------------------------------
          - name: cp-openbao
            cluster: in-cluster
            namespace: openbao
            chartPath: argocd/charts/addons/openbao
          - name: dp-prod-openbao
            cluster: dp-prod
            namespace: openbao
            chartPath: argocd/charts/addons/openbao
          # --- control-plane-only addons -------------------------------------
          - name: cp-thunder
            cluster: in-cluster
            namespace: thunder
            chartPath: argocd/charts/addons/thunder
          # registry and the OpenSearch operator come from classic HTTPS chart
          # repos rather than OCI registries; that distinction now lives in the
          # wrapper Chart.yaml dependencies, not here.
          - name: cp-registry
            cluster: in-cluster
            namespace: openchoreo-workflow-plane
            chartPath: argocd/charts/addons/registry
          - name: cp-opensearch-operator
            cluster: in-cluster
            namespace: openchoreo-observability-plane
            chartPath: argocd/charts/addons/opensearch-operator
  template:
    metadata:
      name: '{{.name}}'
      annotations:
        argocd.argoproj.io/sync-wave: "-20"
    spec:
      project: openchoreo
      source:
        repoURL: https://github.com/koorikla/openchoreo.git
        targetRevision: feat/multicluster-argocd
        path: '{{.chartPath}}'
      destination:
        name: '{{.cluster}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
