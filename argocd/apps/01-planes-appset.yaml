# The OpenChoreo planes themselves. All five wrap the same chart repo at the
# same version; the pin lives in each wrapper chart's Chart.yaml under
# argocd/charts/planes/, so an element only names its destination and the
# wrapper path. Argo CD's repo-server runs `helm dependency build` against the
# committed Chart.lock to fetch the pinned upstream chart, which is why these
# are SINGLE-source git Applications.
#
# ORDERING CAVEAT: like the addons set, an ApplicationSet has no Argo CD health
# check, so the sync-wave below orders only the creation of this CR — it does
# not wait for the addons in wave -20 to become Healthy. Ordering is
# retry-driven; `spec.strategy.type: RollingSync` is the upgrade path if
# first-sync flakes appear.
#
# RETRY: deliberately more generous than the addons set (limit 20, 15s base,
# up to 5m) because each data-plane agent CrashLoops until
# bootstrap/link-planes.sh installs the `cluster-gateway-ca` configmap. Those
# Applications therefore stay unhealthy for a long window on a cold bootstrap
# and must keep retrying rather than fail out.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: planes
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: cp-control-plane
            cluster: in-cluster
            namespace: openchoreo-control-plane
            chartPath: argocd/charts/planes/control-plane
          - name: cp-workflow-plane
            cluster: in-cluster
            namespace: openchoreo-workflow-plane
            chartPath: argocd/charts/planes/workflow-plane
          - name: cp-observability-plane
            cluster: in-cluster
            namespace: openchoreo-observability-plane
            chartPath: argocd/charts/planes/observability-plane
          - name: cp-data-plane-nonprod
            cluster: in-cluster
            namespace: openchoreo-data-plane
            chartPath: argocd/charts/planes/data-plane-nonprod
          - name: dp-prod-data-plane
            cluster: dp-prod
            namespace: openchoreo-data-plane
            chartPath: argocd/charts/planes/data-plane-prod
  template:
    metadata:
      name: '{{.name}}'
      annotations:
        argocd.argoproj.io/sync-wave: "-10"
    spec:
      project: openchoreo
      source:
        repoURL: https://github.com/koorikla/openchoreo.git
        targetRevision: feat/multicluster-argocd
        path: '{{.chartPath}}'
      destination:
        name: '{{.cluster}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 20
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
