apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-shared
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: openchoreo
  source:
    repoURL: https://github.com/koorikla/openchoreo.git
    targetRevision: main
    path: platform-shared
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
