# No `directory:` block on purpose: an explicit source.directory declares the
# source type and would keep this app in Directory mode, ignoring
# namespaces/kustomization.yaml and trying to apply it as a cluster resource.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: openchoreo
  source:
    repoURL: https://github.com/koorikla/openchoreo.git
    targetRevision: feat/multicluster-argocd
    path: namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
