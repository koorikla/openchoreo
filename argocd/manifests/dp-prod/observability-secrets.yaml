# OpenSearch credentials for the dp-prod telemetry agents.
#
# The cp cluster gets this Secret from argocd/manifests/cp/platform-secrets.yaml.
# dp-prod needs its own copy because two of the agents deployed there mount it
# by name, in this namespace:
#
#   * dp-prod-logs-fluentbit  -> the upstream chart's `fluent-bit.env` block
#     feeds HTTP_User/HTTP_Passwd on the OpenSearch output plugin from it.
#   * dp-prod-events-otel     -> collector.extraEnv feeds the collector's
#     basicauth/opensearch extension from it.
#
# (dp-prod-tracing-exporter and dp-prod-metrics-exporter do NOT need it: in
# multiClusterExporter mode neither talks to OpenSearch. tracing-exporter
# explicitly clears the upstream default `opentelemetry-collector.extraEnvs`
# for exactly this reason.)
#
# Without the Secret both agent pods sit in CreateContainerConfigError.
#
# dp-prod runs its own OpenBao (the dp-prod-openbao addon) from the same
# argocd/charts/addons/openbao wrapper, whose server.postStart seed script
# writes the identical `opensearch-username` / `opensearch-password` literals,
# and its own ClusterSecretStore/default (argocd/manifests/common, applied to
# both clusters). So this resolves to the same credentials the cp cluster's
# OpenSearch was bootstrapped with, which is what makes the cross-cluster basic
# auth line up.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-admin-credentials
  namespace: openchoreo-observability-plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: default
  target:
    name: opensearch-admin-credentials
  data:
    - secretKey: username
      remoteRef: { key: opensearch-username, property: value }
    - secretKey: password
      remoteRef: { key: opensearch-password, property: value }
