# Platform ExternalSecrets for the control-plane cluster.
#
# These are NOT workload secrets — they are the credentials the platform's own
# components need in order to start at all, so they must exist before the
# `planes` layer syncs:
#
#   * backstage-secrets            -> argocd/charts/planes/control-plane/values.yaml
#                                     sets backstage.secretName: backstage-secrets
#   * observer-secret              -> argocd/charts/planes/observability-plane
#                                     sets observer.secretName: observer-secret
#   * opensearch-admin-credentials -> consumed by the logs/tracing/events modules
#
# Every `remoteRef.key` below matches a `bao kv put secret/<key>` in the OpenBao
# chart's server.postStart seed script, and every seeded entry stores its payload
# under the `value` property — hence `property: value` throughout.
#
# The two observability secrets live in openchoreo-observability-plane rather
# than this Application's destination namespace, which is why each object carries
# an explicit metadata.namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-secrets
  namespace: openchoreo-control-plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: default
  target:
    name: backstage-secrets
  data:
    - secretKey: backend-secret
      remoteRef: { key: backstage-backend-secret, property: value }
    - secretKey: client-secret
      remoteRef: { key: backstage-client-secret, property: value }
    - secretKey: jenkins-api-key
      remoteRef: { key: backstage-jenkins-api-key, property: value }
    - secretKey: github-actions-token
      remoteRef: { key: backstage-github-actions-token, property: value }
    - secretKey: github-oauth-client-secret
      remoteRef: { key: backstage-github-oauth-client-secret, property: value }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-admin-credentials
  namespace: openchoreo-observability-plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: default
  target:
    name: opensearch-admin-credentials
  data:
    - secretKey: username
      remoteRef: { key: opensearch-username, property: value }
    - secretKey: password
      remoteRef: { key: opensearch-password, property: value }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observer-secret
  namespace: openchoreo-observability-plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: default
  target:
    name: observer-secret
  data:
    - secretKey: UID_RESOLVER_OAUTH_CLIENT_SECRET
      remoteRef: { key: observer-oauth-client-secret, property: value }
