# k3s ships local-path with volumeBindingMode: WaitForFirstConsumer, which
# deadlocks any PVC that Argo CD treats as a PreSync hook: Argo CD waits for
# the PVC to bind before creating workloads, but WaitForFirstConsumer will not
# bind until a consumer pod is scheduled. No pod, no binding, no pod.
#
# Thunder's chart hardcodes "helm.sh/hook": pre-install on its SQLite PVC and
# creates it whenever SQLite is in use, regardless of persistence.enabled, so
# the PVC cannot be avoided from values. This StorageClass binds immediately,
# which breaks the cycle. volumeBindingMode is immutable, so this has to be a
# second class rather than a patch to the built-in one.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-immediate
provisioner: rancher.io/local-path
volumeBindingMode: Immediate
reclaimPolicy: Delete
