# The bridge between External Secrets Operator and OpenBao.
#
# This directory is applied to BOTH clusters (cp and dp-prod). It has to be:
# every plane is registered with `spec.secretStoreRef.name: default`
# (ClusterDataPlane on the nonprod plane in the cp cluster and on the prod plane
# in the dp-prod cluster, plus ClusterWorkflowPlane in the cp cluster). That ref
# resolves to a ClusterSecretStore named `default` in whichever cluster the
# workload lands in, so a store that exists only on the control plane would leave
# every ExternalSecret generated for a dp-prod workload dangling.
#
# The ServiceAccount carries no RBAC of its own. ESO mints a token for it and
# presents that token to OpenBao's `auth/kubernetes` backend, which maps it onto
# `openchoreo-secret-writer-role`. That role is created by the OpenBao chart's
# `server.postStart` hook (argocd/charts/addons/openbao/values.yaml) and is bound
# to `bound_service_account_namespaces="openbao,openchoreo-workflow-plane"` with
# any service account name, so the SA MUST live in the `openbao` namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-openbao
  namespace: openbao
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: default
spec:
  provider:
    vault:
      server: "http://openbao.openbao.svc:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "openchoreo-secret-writer-role"
          serviceAccountRef:
            name: "external-secrets-openbao"
            namespace: "openbao"
