# Thunder's HTTPRoute, lifted out of the Thunder chart.
#
# The chart can render this itself (httproute.enabled), but it attaches to
# gateway-default in openchoreo-control-plane, which the control-plane chart
# creates in the "planes" layer. Thunder is in "addons", three RollingSync
# steps earlier, so the route could never go Healthy there and Argo CD held
# the whole chain on "waiting for healthy state of HTTPRoute/thunder-httproute".
#
# Same reason the Argo CD route lives here: routes run last, after the gateway
# exists.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: thunder-httproute
  namespace: thunder
spec:
  parentRefs:
    - name: gateway-default
      namespace: openchoreo-control-plane
  hostnames:
    - thunder.openchoreo.localhost
  rules:
    - backendRefs:
        - name: thunder-service
          port: 8090
      matches:
        - path:
            type: PathPrefix
            value: /
