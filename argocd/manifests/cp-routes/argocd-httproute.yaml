# Exposes the Argo CD UI on the shared control-plane gateway, so that the URL
# bootstrap/setup.sh prints — http://argocd.openchoreo.localhost:8080 — actually
# resolves. Without this the gateway has no listener rule for that hostname and
# the printed link 404s.
#
# The parentRef targets the `gateway-default` Gateway that
# argocd/charts/planes/control-plane creates in the openchoreo-control-plane
# namespace; its `http` listener is on port 8080, which is the port kind/k3d maps
# to the host. That listener sets allowedRoutes.namespaces.from: All, so this
# cross-namespace attachment from the `argocd` namespace is permitted and no
# ReferenceGrant is needed. The backendRef stays in-namespace (argocd-server is
# in `argocd` alongside this route), so it needs no grant either.
#
# argocd-server is installed with `--insecure` (see bootstrap/setup.sh), i.e. it
# serves plain HTTP on service port 80, which is what the gateway forwards to.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: gateway-default
      namespace: openchoreo-control-plane
  hostnames:
    - argocd.openchoreo.localhost
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
