# Data plane serving development and staging. Runs inside the cp cluster.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterDataPlane
metadata:
  name: dp-nonprod
spec:
  planeID: dp-nonprod
  clusterAgent:
    # The agent's client cert is issued from the control plane's own
    # cluster-gateway CA (clusterAgent.tls.generateCerts=false in the plane's
    # chart values), so the CA the control plane must trust is simply its own.
    # That secret is minted by the control-plane chart, not by
    # bootstrap/link-planes.sh, so this reference is valid on day one.
    clientCA:
      secretKeyRef:
        name: cluster-gateway-ca
        namespace: openchoreo-control-plane
        key: ca.crt
  secretStoreRef:
    name: default
  # Links this plane to ClusterObservabilityPlane/default. The GitOps
  # equivalent of the `kubectl patch` the deleted bootstrap/setup.sh ran after
  # creating the observability plane. Without it the alert-rule traits, which
  # gate on ${has(dataplane.observabilityPlaneRef)}, stay silently dead.
  observabilityPlaneRef:
    kind: ClusterObservabilityPlane
    name: default
  gateway:
    ingress:
      external:
        http:
          host: nonprod.openchoreoapis.localhost
          listenerName: http
          port: 19080
        name: gateway-default
        namespace: openchoreo-data-plane
