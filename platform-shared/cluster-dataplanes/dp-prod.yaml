# Data plane serving production. Runs in its own cluster.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterDataPlane
metadata:
  name: dp-prod
spec:
  planeID: dp-prod
  clusterAgent:
    clientCA:
      # Populated by bootstrap/link-planes.sh once the agent has minted its CA.
      # Using secretKeyRef instead of an inline value is what lets this manifest
      # live in git as static YAML.
      secretKeyRef:
        name: dp-prod-agent-ca
        namespace: openchoreo-control-plane
        key: ca.crt
  secretStoreRef:
    name: default
  gateway:
    ingress:
      external:
        http:
          host: prod.openchoreoapis.localhost
          listenerName: http
          port: 29080
        name: gateway-default
        namespace: openchoreo-data-plane
