# The observability plane. Runs inside the cp cluster, in
# openchoreo-observability-plane. The data planes and the workflow plane point
# their observabilityPlaneRef at this object; the alert-rule traits gate on
# ${has(dataplane.observabilityPlaneRef)} and stay dead without it.
#
# Note: ClusterObservabilityPlane has no secretStoreRef field - unlike
# ClusterDataPlane and ClusterWorkflowPlane it does not broker secrets.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterObservabilityPlane
metadata:
  name: default
spec:
  planeID: default
  clusterAgent:
    # The agent's client cert is issued from the control plane's own
    # cluster-gateway CA (clusterAgent.tls.generateCerts=false in the plane's
    # chart values), so the CA the control plane must trust is simply its own.
    # That secret is minted by the control-plane chart, not by
    # bootstrap/link-planes.sh, so this reference is valid on day one.
    clientCA:
      secretKeyRef:
        name: cluster-gateway-ca
        namespace: openchoreo-control-plane
        key: ca.crt
  # Required field. Reached through the cp cluster's gateway on the
  # openchoreo.localhost:11080 listener that bootstrap/port-forward.sh exposes.
  observerURL: http://observer.openchoreo.localhost:11080
